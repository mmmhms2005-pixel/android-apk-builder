name: Android Build

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: 8.7

    - name: Remove unused directories
      run: |
        rm -rf app/src/main/res
        rm -rf app/src/main/java/com/example/sampleapp

    - name: Create App Icon
      run: |
        mkdir -p app/src/main/res/values
        mkdir -p app/src/main/res/drawable
        mkdir -p app/src/main/res/mipmap-anydpi-v26
        printf '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <color name="ic_launcher_background">#1B5E20</color>\n</resources>\n' > app/src/main/res/values/colors.xml
        printf '<?xml version="1.0" encoding="utf-8"?>\n<vector xmlns:android="http://schemas.android.com/apk/res/android"\n    android:width="108dp" android:height="108dp"\n    android:viewportWidth="108" android:viewportHeight="108">\n    <path android:fillColor="#FFFFFF" android:pathData="M54,20 C35.2,20 20,35.2 20,54 C20,72.8 35.2,88 54,88 C72.8,88 88,72.8 88,54 C88,35.2 72.8,20 54,20 Z"/>\n    <path android:fillColor="#1B5E20" android:pathData="M54,30 L63,38 L60,50 L48,50 L45,38 Z"/>\n    <path android:fillColor="#1B5E20" android:pathData="M45,68 L54,60 L63,68 L60,78 L48,78 Z"/>\n    <path android:fillColor="#1B5E20" android:pathData="M32,48 L42,48 L45,58 L38,64 L30,58 Z"/>\n    <path android:fillColor="#1B5E20" android:pathData="M76,48 L66,48 L63,58 L70,64 L78,58 Z"/>\n</vector>\n' > app/src/main/res/drawable/ic_launcher_foreground.xml
        printf '<?xml version="1.0" encoding="utf-8"?>\n<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">\n    <background android:drawable="@color/ic_launcher_background"/>\n    <foreground android:drawable="@drawable/ic_launcher_foreground"/>\n</adaptive-icon>\n' > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
        cp app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml

    - name: Generate Gradle Wrapper
      run: gradle wrapper --gradle-version 8.7

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
